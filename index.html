<!doctype html><html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e29"><title>六合彩注項隨機產生器</title><style>:root{color-scheme:dark;--muted:#acc0ca;--gold:#f0cf90}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-width:280px;color:#edf4f6;font:16px/1.5 system-ui,-apple-system,'Noto Sans HK',sans-serif;background:radial-gradient(circle at 50% -10%,#2e4c5d,#0c1822 65%)}main{max-width:700px;margin:auto;padding:24px 15px calc(32px + env(safe-area-inset-bottom))}h1{margin:0;font-size:clamp(1.6rem,5.4vw,2.3rem);line-height:1.23}h2{font-size:1.08rem;margin:0 0 13px}.lead,.muted{color:var(--muted)}.lead{font-size:.89rem;margin:10px 0 21px}.card{border:1px solid #405966;border-radius:17px;background:linear-gradient(145deg,#1a2f3d,#12212d);padding:18px;margin-bottom:15px;box-shadow:0 12px 28px #0003}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.field{margin-bottom:15px}.field label{display:block;font-size:.86rem;color:#d5e4e9;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;height:46px;border-radius:10px;border:1px solid #5d7582;background:#0c1c28;color:#f2f6f7;font:inherit;font-size:16px;padding:8px 11px}.field input:focus-visible,.field select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.estimate{background:#0f222d;border:1px solid #4a6570;border-radius:10px;padding:11px 13px;font-size:.85rem;min-height:48px;margin-bottom:16px}.estimate strong{color:var(--gold)}button{border:0;border-radius:10px;font:inherit;font-weight:750;min-height:45px;cursor:pointer;touch-action:manipulation}.primary{width:100%;background:linear-gradient(#ffe5af,#d0a662);color:#192630}.primary:disabled{opacity:.5}.status{min-height:25px;color:#f1d49d;font-size:.83rem;margin:9px 0 0}.balls{min-height:56px;display:flex;align-items:center;flex-wrap:wrap;gap:9px}.ball{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff9;color:#fff;font-weight:850;font-size:1.04rem;text-shadow:0 1px 2px #0009;box-shadow:inset 3px 4px 7px #fff7,inset -4px -5px 9px #0007;animation:appear .42s cubic-bezier(.17,1.45,.47,1) both}.red{background:radial-gradient(circle at 28% 22%,#ffd0c5,#eb5851 55%,#9c2931)}.blue{background:radial-gradient(circle at 28% 22%,#d3eeff,#559fe0 55%,#235a8f)}.green{background:radial-gradient(circle at 28% 22%,#d8f7c9,#61c486 55%,#298051)}.banker{outline:2px solid var(--gold);outline-offset:2px;margin:3px 3px 3px 0}.separator{align-self:center;color:var(--gold);font-size:23px}.placeholder,.foot{color:var(--muted);font-size:.84rem}.numline{font-size:.82rem;color:#cddde0;overflow-wrap:anywhere;margin:11px 0 0}.info{font-size:.78rem;color:var(--muted);margin:6px 0 0}.history-title{margin-bottom:12px}.history-count{font-weight:400;color:var(--muted)}.history-list{display:grid;gap:8px;max-height:480px;overflow:auto;overscroll-behavior:contain}.item{border:1px solid #3d5663;background:#0e202b;border-radius:11px;padding:11px 12px}.meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:.76rem;color:#b9ccd2}.item-line{font-size:.9rem;overflow-wrap:anywhere;margin:5px 0 0}.empty{padding:20px;border:1px dashed #57717b;border-radius:12px;text-align:center;color:var(--muted);font-size:.85rem}.foot{line-height:1.65}[hidden]{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(-14px) scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.ball{animation:none}}@media(max-width:480px){main{padding:20px 12px calc(26px + env(safe-area-inset-bottom))}.card{padding:15px}.balls{gap:7px}.ball{width:40px;height:40px;flex-basis:40px;font-size:.95rem}}@media(max-width:335px){.fields{grid-template-columns:1fr}}</style></head><body><main><h1>六合彩注項隨機產生器</h1><p class="lead">選好類型，按一下產生一組；號碼逐顆出現，之前的結果列在下方。</p><section class="card"><h2>設定注項</h2><div class="field"><label for="type">注項類型</label><select id="type"><option value="single">單式 · 6 個號碼</option><option value="multiple">複式 · 7–49 個號碼</option><option value="banker">膽拖 · 膽 + 拖腳</option></select></div><div class="fields"><div class="field" id="multipleWrap" hidden><label for="multiple">複式號碼數</label><input id="multiple" type="number" min="7" max="49" value="7" inputmode="numeric"></div><div class="field" id="bankWrap" hidden><label for="bank">膽數</label><input id="bank" type="number" min="1" max="5" value="2" inputmode="numeric"></div><div class="field" id="legWrap" hidden><label for="leg">拖腳數</label><input id="leg" type="number" min="2" max="48" value="5" inputmode="numeric"></div></div><div id="estimate" class="estimate" aria-live="polite"></div><button class="primary" id="generate">產生一組</button><p id="status" class="status" role="status" aria-live="polite"></p></section><section class="card"><h2>最新注項</h2><div id="balls" class="balls"><span class="placeholder">尚未產生注項</span></div><p id="line" class="numline"></p><p id="info" class="info"></p></section><section class="card"><h2 class="history-title">歷史記錄 <span id="count" class="history-count">(0)</span></h2><div id="history" class="history-list"><div class="empty">暫時沒有記錄</div></div></section><p class="foot">歷史只在此頁面暫存，重新整理或關閉後會消失。單式顯示全注金額；複式及膽拖同時顯示半注與全注的參考金額。非香港賽馬會官方產品，不接受投注。</p></main><script>(()=>{'use strict';const $=s=>document.querySelector(s),type=$('#type'),multiple=$('#multiple'),bank=$('#bank'),leg=$('#leg'),balls=$('#balls'),status=$('#status'),line=$('#line'),info=$('#info'),historyEl=$('#history');let history=[],busy=false;const fmt=n=>Number(n).toLocaleString('en-HK'),pad=n=>String(n).padStart(2,'0'),names={single:'單式',multiple:'複式',banker:'膽拖'},sleep=ms=>new Promise(r=>setTimeout(r,ms));function comb(n,k){let x=1;for(let i=1;i<=k;i++)x=x*(n-k+i)/i;return Math.round(x)}function getInt(el,min,max){let v=el.value.trim();if(!/^\d+$/.test(v))throw Error(`${el.labels?.[0]?.textContent||'數值'}須為整數`);let n=Number(v);if(n<min||n>max)throw Error(`${el.labels?.[0]?.textContent||'數值'}須在 ${min} 至 ${max} 之間`);return n}function config(){let t=type.value,a=0,b=0,per=1;if(t==='multiple'){a=getInt(multiple,7,49);per=comb(a,6)}else if(t==='banker'){a=getInt(bank,1,5);b=getInt(leg,7-a,49-a);per=comb(b,6-a)}return {type:t,a,b,per}}function price(s){return s.type==='single'?`${fmt(s.per)} 注 · 全注 HK$${fmt(s.per*10)}`:`${fmt(s.per)} 注 · 半注 HK$${fmt(s.per*5)} · 全注 HK$${fmt(s.per*10)}`}function secureInt(max){let a=new Uint32Array(1),lim=4294967296-4294967296%max;do crypto.getRandomValues(a);while(a[0]>=lim);return a[0]%max}function sample(k){let a=Array.from({length:49},(_,i)=>i+1);for(let i=0;i<k;i++){let j=i+secureInt(49-i);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}function make(s){let arr=sample(s.type==='single'?6:s.type==='multiple'?s.a:s.a+s.b);return s.type==='banker'?{bankers:arr.slice(0,s.a).sort((x,y)=>x-y),legs:arr.slice(s.a).sort((x,y)=>x-y)}:{numbers:arr.sort((x,y)=>x-y)}}function text(e){return e.bankers?e.bankers.map(pad).join('+')+' > '+e.legs.map(pad).join('+'):e.numbers.map(pad).join('+')}function ball(n,banker){let el=document.createElement('span');el.className='ball '+['red','blue','green'][(n-1)%3]+(banker?' banker':'');el.textContent=pad(n);return el}function arrow(){let el=document.createElement('span');el.className='separator';el.textContent='›';el.setAttribute('aria-label','拖腳');return el}function addHistory(b){history.unshift(b);history=history.slice(0,100);historyEl.replaceChildren();$('#count').textContent=`(${history.length})`;history.forEach(item=>{let el=document.createElement('article');el.className='item';let meta=document.createElement('div');meta.className='meta';let date=document.createElement('time');date.dateTime=item.at;date.textContent=new Date(item.at).toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',second:'2-digit'});let summary=document.createElement('span');summary.textContent=`${names[item.type]} · ${price(item)}`;let numbers=document.createElement('p');numbers.className='item-line';numbers.textContent=text(item.entry);meta.append(date,summary);el.append(meta,numbers);historyEl.append(el)})}function update(){let t=type.value;$('#multipleWrap').hidden=t!=='multiple';$('#bankWrap').hidden=t!=='banker';$('#legWrap').hidden=t!=='banker';let n=Number(bank.value);leg.min=Number.isInteger(n)&&n>=1&&n<=5?7-n:2;leg.max=Number.isInteger(n)&&n>=1&&n<=5?49-n:48;try{let s=config();$('#estimate').innerHTML=s.type==='single'?`<strong>${fmt(s.per)} 注</strong> · 全注 <strong>HK$${fmt(s.per*10)}</strong>`:`<strong>${fmt(s.per)} 注</strong> · 半注 <strong>HK$${fmt(s.per*5)}</strong> · 全注 <strong>HK$${fmt(s.per*10)}</strong>`}catch(e){$('#estimate').textContent=e.message}}async function generate(){if(busy)return;let s,e;try{s=config();e=make(s)}catch(err){status.textContent=err.message;return}busy=true;$('#generate').disabled=true;balls.replaceChildren();line.textContent='';info.textContent='';let sequence=e.bankers?[...e.bankers.map(n=>[n,true]),['arrow',false],...e.legs.map(n=>[n,false])]:e.numbers.map(n=>[n,false]);let total=sequence.length-(e.bankers?1:0),done=0,delay=matchMedia('(prefers-reduced-motion: reduce)').matches?0:total>20?65:total>12?100:250;for(const [n,isBanker] of sequence){if(n==='arrow'){balls.append(arrow());continue}balls.append(ball(n,isBanker));status.textContent=`產生中 · ${++done}/${total}`;if(delay)await sleep(delay)}line.textContent=text(e);info.textContent=`${names[s.type]} · ${price(s)}`;addHistory({at:new Date().toISOString(),...s,entry:e});status.textContent='已產生一組';$('#generate').disabled=false;busy=false}for(const el of [type,multiple,bank,leg])for(const evt of ['input','change'])el.addEventListener(evt,update);$('#generate').onclick=generate;update()})();</script></body></html>
