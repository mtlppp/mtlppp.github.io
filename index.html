<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>旅行貓紙 · 手機 Demo</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eceee7;color:#263b30;font-family:system-ui,sans-serif}main{width:100%;max-width:480px;min-height:100dvh;margin:auto;background:#f7f5ee;padding:calc(20px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:22px;margin:0}button{font:inherit;min-height:44px;border:1px solid #cdd7cb;border-radius:10px;background:white;color:#315b45;padding:10px 12px;touch-action:manipulation;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #6c987e}.sub{font-size:14px;color:#677369}.intro{font-size:15px;line-height:1.5}details{margin:14px 0;background:white;border:1px solid #dddfd5;border-radius:16px;overflow:hidden}summary{cursor:pointer;min-height:68px;padding:18px 15px;font-size:18px;font-weight:650;list-style:none}summary:after{content:'＋';float:right}details[open] summary:after{content:'−'}.card{display:block;width:calc(100% - 20px);margin:0 10px 10px;text-align:left;padding:16px 14px}.jp{font-size:clamp(23px,6.4vw,28px);line-height:1.55;overflow-wrap:anywhere}.meaning{font-size:16px;margin-top:8px}.roman{font-size:14px;color:#627062;margin-top:8px;overflow-wrap:anywhere}.tip{font-size:13px;line-height:1.5;color:#566653;margin-top:10px}.label{text-align:right;font-size:12px;margin-top:12px}.switch{display:flex;gap:8px;padding:0 10px 12px}.selected{background:#315b45;color:white}footer{font-size:12px;text-align:center;color:#657367;margin-top:28px}dialog{border:0;background:#fffef8;color:#263b30;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}.display{min-height:calc(100dvh - 110px - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-width:480px;margin:auto;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 0}.display .jp{font-size:clamp(36px,10vw,54px)}.display .meaning{margin-top:28px;font-size:18px}.display .roman{font-size:16px}header button{font-size:14px;flex-shrink:0}</style><main><header><h1 id="title"></h1><button id="lang"></button></header><p class="sub" id="sub"></p><p class="intro" id="intro"></p><section id="groups"></section><footer id="footer"></footer></main><dialog id="view"><button id="back"></button><div class="display"><div class="jp" id="jp" lang="ja"></div><div class="meaning" id="meaning"></div><div class="roman" id="roman"></div></div></dialog><script>const rows=[["これはありますか？", "你們有這個嗎？", "Do you have this?", "Kore wa arimasu ka?"], ["これをください。", "請給我這個。", "This one, please.", "Kore o kudasai"], ["値段を書いてください。", "請寫下價錢。", "Please write down the price.", "Nedan o kaite kudasai"], ["お会計お願いします。", "請結帳。", "The bill, please.", "Okaikei onegaishimasu"], ["カードは使えますか？", "可以用卡付款嗎？", "Can I pay by card?", "Kādo wa tsukaemasu ka?"], ["トイレはどこですか？", "洗手間在哪裏？", "Where is the toilet?", "Toire wa doko desu ka?"], ["ここに行きたいです。", "我想去這裏。", "I want to go here.", "Koko ni ikitai desu"], ["予約しています。", "我有預約。", "I have a reservation.", "Yoyaku shite imasu"], ["手伝ってください。", "請幫我一下。", "Please help me.", "Tetsudatte kudasai"], ["すみません。", "不好意思。", "Excuse me.", "Sumimasen"], ["日本語がわかりません。", "我不懂日語。", "I don’t understand Japanese.", "Nihongo ga wakarimasen"], ["すみません、いりません。", "不好意思，不用了。", "Sorry, no thank you.", "Sumimasen, irimasen"], ["ありがとう。", "謝謝。", "Thank you.", "Arigatō"]];const groups=[['買東西／點餐','Shopping / Ordering',0,2],['價錢／付款','Prices / Payment',2,5],['找地方／辦事情','Directions / Assistance',5,9],['回應／禮貌','Responses / Courtesy',9,13]];const tips={0:['展示商品照片或樣本。','Show a photo or sample.'],1:['指向商品或菜單。','Point to the item or menu.'],4:['接着展示你的卡。','Then show your card.'],6:['接着展示目的地。','Then show your destination.'],7:['展示預約確認資料。','Show your booking confirmation.'],8:['指向需要協助的物件。','Point to what you need help with.']};const $=x=>document.getElementById(x);let en=false,cash=false;try{en=localStorage.getItem('cheat-lang')==='en'}catch(e){}function render(){const open=[...document.querySelectorAll('details')].map(d=>d.open);$('title').textContent=en?'Travel Cheat Sheet':'旅行貓紙';$('lang').textContent=en?'繁體中文':'English';$('sub').textContent=en?'Japanese · Japan':'日語 · 日本';$('intro').textContent=en?'Read it aloud, or tap to show.':'照着讀，或點一下給對方看。';$('footer').textContent=en?'Mobile demo · All phrases included · No ads':'手機 Demo · 全部句子已內置 · 無廣告';$('back').textContent=en?'‹ Back':'‹ 返回';document.documentElement.lang=en?'en':'zh-Hant';$('groups').replaceChildren();groups.forEach((g,gi)=>{const d=document.createElement('details');d.open=!!open[gi];const s=document.createElement('summary');s.textContent=g[en?1:0];d.append(s);for(let i=g[2];i<g[3];i++){let r=rows[i];if(i===4){const sw=document.createElement('div');sw.className='switch';[false,true].forEach(v=>{const b=document.createElement('button');b.textContent=v?(en?'Cash':'現金'):(en?'Card':'卡');b.className=v===cash?'selected':'';b.onclick=()=>{cash=v;render()};sw.append(b)});d.append(sw);if(cash)r=['現金で払えますか？','可以用現金付款嗎？','Can I pay in cash?','Genkin de haraemasu ka?']}const b=document.createElement('button');b.className='card';const add=(cls,text)=>{const x=document.createElement('div');x.className=cls;x.textContent=text;if(cls==='jp')x.lang='ja';b.append(x)};add('jp',r[0]);add('meaning',r[en?2:1]);add('roman',r[3]);if(r[0].includes('は'))add('tip',en?'Read: は → wa':'讀法：は 讀 wa。');if(r[0].includes('を'))add('tip',en?'Read: を → o':'讀法：を 讀 o。');if(tips[i]&&!(i===4&&cash))add('tip',(en?'Use: ':'用法：')+tips[i][en?1:0]);add('label',en?'Show larger ›':'放大看 ›');b.onclick=()=>{$('jp').textContent=r[0];$('meaning').textContent=r[en?2:1];$('roman').textContent=r[3];$('view').showModal()};d.append(b)}$('groups').append(d)})}$('lang').onclick=()=>{en=!en;try{localStorage.setItem('cheat-lang',en?'en':'zh')}catch(e){}render()};$('back').onclick=()=>$('view').close();render();</script></html>
