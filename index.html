<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>旅行貓紙</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:#133e34;font-family:system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:10px;justify-content:space-between}h1{font-family:Georgia,'Noto Serif TC','Songti TC',serif;font-size:clamp(26px,7vw,36px);letter-spacing:-1px;margin:0;line-height:1.15}.toggle{display:flex;border:1px solid #bec7bf;border-radius:24px;padding:2px;flex-shrink:0}button{font:inherit;cursor:pointer;touch-action:manipulation}.toggle button{border:0;background:transparent;border-radius:20px;padding:8px 11px;min-height:40px;color:#687369}.toggle .active{background:#205b43;color:white}.subtitle{font-family:Georgia,'Songti TC',serif;font-size:21px;margin:12px 0}.intro{font-size:14px;color:#576563;margin:12px 0 22px}.badge{display:inline-block;background:#e3eee2;border-radius:20px;padding:7px 10px;font-size:12px;margin-bottom:16px}details{border:1px solid #e0e5de;border-radius:12px;background:#ffffffa6;margin:8px 0}summary{list-style:none;display:flex;align-items:center;gap:14px;padding:15px;cursor:pointer;min-height:70px}summary::-webkit-details-marker{display:none}summary strong{font-size:17px;font-weight:600}summary small{display:block;color:#707a79;font-size:13px;margin-top:4px}summary:after{content:'⌄';margin-left:auto;font-size:23px}details[open] summary:after{content:'⌃'}svg{width:30px;height:30px;stroke:#154c3c;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.card{width:calc(100% - 20px);margin:0 10px 10px;border:1px solid #dfe3de;border-radius:11px;background:#fff;padding:17px 14px;display:flex;gap:14px;text-align:left;color:#111a24}.card svg{width:32px;height:32px;margin-top:3px}.content{min-width:0;flex:1}.jp{font-size:clamp(22px,5.8vw,26px);line-height:1.5;font-weight:600;overflow-wrap:anywhere}.meaning{font-size:17px;line-height:1.5;margin-top:3px}.roman{font-family:Georgia,serif;font-size:16px;color:#777b84;margin-top:5px}.tip{font-size:13px;color:#667071;line-height:1.6;margin-top:14px}.tip+.tip{margin-top:1px}.show{font-size:13px;color:#245d47;text-align:right;margin-top:10px}.payment{display:flex;gap:8px;padding:0 10px 10px}.payment button,#back{border:1px solid #cbd5cc;background:white;border-radius:10px;min-height:44px;padding:9px 14px;color:#245d47}.payment .active{background:#245d47;color:white}button:focus-visible,summary:focus-visible{outline:3px solid #71a587;outline-offset:2px}footer{text-align:center;font-size:12px;color:#738075;margin-top:22px}dialog{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border:0;padding:calc(16px + env(safe-area-inset-top)) 20px;background:#fffef9;color:#142d25}.display{min-height:calc(100dvh - 110px);max-width:520px;margin:auto;display:flex;flex-direction:column;justify-content:center;text-align:center}.display .jp{font-size:clamp(36px,10vw,56px);font-weight:500}.display .meaning{font-size:18px;margin-top:26px}.display .roman{font-size:16px;margin-top:12px}@media(min-width:600px){main{min-height:100dvh;background:#faf9f4;box-shadow:0 0 30px #253a2310}}@media(max-width:360px){main{padding-left:10px;padding-right:10px}.card{gap:10px;padding:14px 10px}.card svg{width:26px}summary{gap:10px}h1{font-size:25px}}</style><main><header><h1 id="title"></h1><div class="toggle"><button id="zh">中文</button><button id="en">EN</button></div></header><div class="subtitle" id="subtitle"></div><p class="intro" id="intro"></p><div class="badge" id="badge"></div><section id="groups"></section><footer id="footer"></footer></main><dialog id="viewer"><button id="back"></button><div class="display"><div class="jp" id="big" lang="ja"></div><div class="meaning" id="translation"></div><div class="roman" id="reading"></div></div></dialog><script>const rows=[["これはありますか？", "你們有這個嗎？", "Do you have this?", "Kore wa arimasu ka?", "展示商品照片或樣本。", "Show a photo or sample."], ["これをください。", "請給我這個。", "This one, please.", "Kore o kudasai", "指向商品或菜單。", "Point to the item or menu."], ["値段を書いてください。", "請寫下價錢。", "Please write down the price.", "Nedan o kaite kudasai", "讓對方寫下或展示數字。", "Ask them to write or show the number."], ["お会計お願いします。", "請結帳。", "The bill, please.", "Okaikei onegaishimasu", "", ""], ["カードは使えますか？", "可以用卡付款嗎？", "Can I pay by card?", "Kādo wa tsukaemasu ka?", "接着展示你的卡。", "Then show your card."], ["トイレはどこですか？", "洗手間在哪裏？", "Where is the toilet?", "Toire wa doko desu ka?", "配合指方向的手勢。", "Use a pointing gesture."], ["ここに行きたいです。", "我想去這裏。", "I want to go here.", "Koko ni ikitai desu", "接着展示目的地。", "Then show your destination."], ["予約しています。", "我有預約。", "I have a reservation.", "Yoyaku shite imasu", "展示預約確認資料。", "Show your booking confirmation."], ["手伝ってください。", "請幫我一下。", "Please help me.", "Tetsudatte kudasai", "指向需要協助的物件。", "Point to what you need help with."], ["すみません。", "不好意思。", "Excuse me.", "Sumimasen", "", ""], ["日本語がわかりません。", "我不懂日語。", "I don’t understand Japanese.", "Nihongo ga wakarimasen", "", ""], ["すみません、いりません。", "不好意思，不用了。", "Sorry, no thank you.", "Sumimasen, irimasen", "", ""], ["ありがとう。", "謝謝。", "Thank you.", "Arigatō", "", ""]];const groups=[['買東西／點餐','Shopping / Ordering','找商品、選東西','Find and choose items',0,2,'bag'],['價錢／付款','Prices / Payment','問價、結帳、付款','Price, bill, payment',2,5,'card'],['找地方／辦事情','Directions / Assistance','洗手間、目的地、預約、協助','Toilet, destination, booking, help',5,9,'pin'],['回應／禮貌','Responses / Courtesy','打擾、聽不懂、拒絕、致謝','Excuse me, language, refusal, thanks',9,13,'chat']];const paths={bag:'<path d="M5 10h14l2 12H3zM8 11V7a4 4 0 0 1 8 0v4"/>',card:'<rect x="2" y="5" width="20" height="15" rx="2"/><path d="M2 10h20M5 16h3"/>',pin:'<path d="M12 23s8-8 8-14a8 8 0 1 0-16 0c0 6 8 14 8 14z"/><circle cx="12" cy="9" r="2.5"/>',chat:'<path d="M21 11c0 5-4 8-9 8H8l-5 3 1-6a8 8 0 0 1-2-5c0-5 4-8 10-8s9 3 9 8z"/>',box:'<path d="M3 6l8-4 8 4-8 4zM3 6v12l6 3M11 10v6M19 6v5"/><circle cx="17" cy="17" r="4"/><path d="M20 20l3 3"/>',bill:'<path d="M5 2h14v21l-3-2-4 2-4-2-3 2zM8 7h8M8 11h8M8 15h5"/>',calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M7 2v5M17 2v5M3 9h18M8 15l3 3 5-6"/>',hand:'<path d="M5 13V7a2 2 0 0 1 4 0v5-8a2 2 0 0 1 4 0v8-6a2 2 0 0 1 4 0v6-3a2 2 0 0 1 4 0v7c0 5-4 7-8 7-3 0-5-2-7-5l-3-4a2 2 0 0 1 3-2l3 3"/>',heart:'<path d="M12 21L3 12C-3 3 8-1 12 6c4-7 15-3 9 6z"/>'};const icons=['box','bag','bill','bill','card','pin','pin','calendar','hand','chat','chat','hand','heart'];const $=id=>document.getElementById(id);let en=false,cash=false,first=true;try{en=localStorage.getItem('cheat-ui')==='en'}catch(e){}function icon(name){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[name]+'</svg>'}function render(){const opened=[...document.querySelectorAll('details')].map(d=>d.open);document.documentElement.lang=en?'en':'zh-Hant';$('title').textContent=en?'Travel Cheat Sheet':'旅行貓紙';$('zh').className=en?'':'active';$('en').className=en?'active':'';$('zh').setAttribute('aria-pressed',!en);$('en').setAttribute('aria-pressed',en);$('subtitle').textContent=en?'Japanese · Japan':'日語 · 日本';$('intro').textContent=en?'Read it aloud, or tap to show.':'照着讀，或點一下給對方看。';$('badge').textContent=en?'✓ Phrases included · Demo':'✓ 句子已內置 · Demo';$('back').textContent=en?'‹ Back':'‹ 返回';$('footer').textContent=en?'Mobile prototype · No ads':'手機互動原型 · 無廣告';$('groups').replaceChildren();groups.forEach((g,gi)=>{const d=document.createElement('details');d.open=first?gi===0:!!opened[gi];const s=document.createElement('summary');s.innerHTML=icon(g[6]);const txt=document.createElement('div');const title=document.createElement('strong');title.textContent=g[en?1:0];txt.append(title);if(!d.open){const small=document.createElement('small');small.textContent=g[en?3:2];txt.append(small)}s.append(txt);d.append(s);for(let i=g[4];i<g[5];i++){let r=rows[i];if(i===4){const sw=document.createElement('div');sw.className='payment';[false,true].forEach(v=>{const b=document.createElement('button');b.textContent=v?(en?'Cash':'現金'):(en?'Card':'卡');b.className=v===cash?'active':'';b.setAttribute('aria-pressed',v===cash);b.onclick=()=>{cash=v;render()};sw.append(b)});d.append(sw);if(cash)r=['現金で払えますか？','可以用現金付款嗎？','Can I pay in cash?','Genkin de haraemasu ka?','如需確認，展示現金。','Show cash if needed.']}const b=document.createElement('button');b.className='card';b.innerHTML=icon(icons[i]);const content=document.createElement('div');content.className='content';function add(cls,text){const el=document.createElement('div');el.className=cls;el.textContent=text;if(cls==='jp')el.lang='ja';content.append(el)}add('jp',r[0]);add('meaning',r[en?2:1]);add('roman',r[3]);if(r[0].includes('は'))add('tip',en?'Pronunciation: は sounds like wa.':'讀法：は 讀 wa。');else if(r[0].includes('を'))add('tip',en?'Pronunciation: を sounds like o.':'讀法：を 讀 o。');else if(r[3].includes('ō'))add('tip',en?'Pronunciation: Hold the ō sound longer.':'讀法：ō 的 o 音拉長。');if(r[en?5:4])add('tip',(en?'Use: ':'用法：')+r[en?5:4]);add('show',en?'Show larger ›':'放大看 ›');b.append(content);b.onclick=()=>{$('big').textContent=r[0];$('translation').textContent=r[en?2:1];$('reading').textContent=r[3];$('viewer').showModal()};d.append(b)}$('groups').append(d)});first=false}function change(v){en=v;try{localStorage.setItem('cheat-ui',v?'en':'zh')}catch(e){}render()}$('zh').onclick=()=>change(false);$('en').onclick=()=>change(true);$('back').onclick=()=>$('viewer').close();render();</script></html>
